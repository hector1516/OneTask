upstream onetask_api {
  server api:3000;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API interna: nginx quita Origin para que Express no vea CORS cross-origin.
  location /api/ {
    proxy_pass http://onetask_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Origin "";
  }
  location /auth/ {
    proxy_pass http://onetask_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Origin "";
  }
  location = /health {
    proxy_pass http://onetask_api;
    proxy_set_header Origin "";
  }
  location = /api/v1/public-key {
    proxy_pass http://onetask_api;
    proxy_set_header Origin "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
