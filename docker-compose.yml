networks:
  onetask:
    driver: bridge

volumes:
  mysql_data:
  modules_storage:

services:
  mysql:
    image: mysql:8
    container_name: onetask-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-onetask_root_pw_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-onetask}
      MYSQL_USER: ${MYSQL_USER:-onetask}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-onetask_pw_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - onetask
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  api:
    build: ./api
    container_name: onetask-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-onetask}
      DB_USER: ${MYSQL_USER:-onetask}
      DB_PASSWORD: ${MYSQL_PASSWORD:-onetask_pw_change_me}
      API_PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - modules_storage:/app/storage
      # Seed sources (read-only) so the API can (re)generate bundles on boot:
      - ./api/seeds:/app/seeds:ro
    networks:
      - onetask
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: onetask-admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-5173}:80"
    networks:
      - onetask

  # Optional: docker compose --profile tools up phpmyadmin
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: onetask-phpmyadmin
    restart: "no"
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-onetask_root_pw_change_me}
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    networks:
      - onetask
    profiles:
      - tools
